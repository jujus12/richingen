name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Save error log on failure
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80 > errors.txt || true
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan buildlog
          git rm -rf . -q || true
          cp errors.txt ERRORS.txt
          git add ERRORS.txt
          git commit -qm "build errors"
          git push -f origin buildlog

      - name: Rename APK
        run: cp build/outputs/apk/debug/*.apk richingen.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: richingen.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: richingen-debug-apk
          path: richingen.apk
